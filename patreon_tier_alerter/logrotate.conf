# Logrotate configuration for Patreon Tier Alerter Bot
# Place this file in /etc/logrotate.d/ or use with logrotate command

/home/ubuntu/patreon-bot/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 ubuntu ubuntu
    su ubuntu ubuntu
    postrotate
        # Optional: restart the bot if needed
        # systemctl restart patreon-bot
    endscript
}
